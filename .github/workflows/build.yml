name: APK Derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - name: APK adını Skor.apk yap
        run: cp app/build/outputs/apk/debug/app-debug.apk Skor.apk
      - name: Releases'e yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --cleanup-tag -y || true
          gh release create son-surum Skor.apk --title "Skor son sürüm" --notes "Skor.apk dosyasını indirip kur." --target "$GITHUB_SHA"
